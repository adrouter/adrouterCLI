name: One-time npm package bootstrap

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable protected beta tag to bootstrap
        required: true
        type: string

permissions: {}
concurrency:
  group: npm-bootstrap-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    environment: npm-bootstrap
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Refuse bootstrap publication outside the canonical repository
        env:
          ACTUAL_REPOSITORY: ${{ github.repository }}
        run: test "${ACTUAL_REPOSITORY}" = "adrouter/adrouterCLI"
      - name: Checkout immutable tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.19.0"
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Install npm with staged-publishing support
        run: npm install --global npm@11.18.0
      - name: Install system prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -sf "$(command -v fdfind)" /usr/local/bin/fd
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/validate-release-tag.mjs "${{ inputs.tag }}"
      - run: npm run build
      - run: npm run check
      - run: npm run check:beta-readiness
      - run: node scripts/test.mjs
      - name: Checkout protected verifier from the workflow commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: release-verifier-source
          sparse-checkout: scripts/verify-draft-release.mjs
          persist-credentials: false
      - name: Verify the immutable draft before any registry operation
        env:
          GH_TOKEN: ${{ github.token }}
        run: node release-verifier-source/scripts/verify-draft-release.mjs "${{ inputs.tag }}"
      - name: Validate all package publish dry-runs
        run: node scripts/publish.mjs --dry-run
      - name: Stage packages in dependency order with a one-time token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: node scripts/publish.mjs --stage --manifest npm-artifacts.json
