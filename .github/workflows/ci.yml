name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build-check-test-pack:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-24.04
          - platform: linux-arm64
            os: ubuntu-24.04-arm
          - platform: windows-x64
            os: windows-2025
          - platform: windows-arm64
            os: windows-11-arm
          - platform: darwin-x64
            os: macos-15-intel
          - platform: darwin-arm64
            os: macos-15
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.19.0"
          cache: npm

      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -sf "$(command -v fdfind)" /usr/local/bin/fd

      - name: Install macOS prerequisites
        if: runner.os == 'macOS'
        run: brew install fd ripgrep

      - name: Install Windows prerequisites
        if: runner.os == 'Windows'
        run: |
          choco install fd --version=10.4.2 --yes --no-progress
          choco install ripgrep --version=14.1.0 --yes --no-progress

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Check full beta readiness
        run: |
          npm run check
          npm run check:beta-readiness
        shell: bash

      - name: Test with cross-platform isolation
        run: node scripts/test.mjs

      - name: Pack and install the single bundled CLI tarball
        run: node scripts/ci-package-smoke.mjs

      - name: Verify the exact anonymous npm candidate on Windows
        if: runner.os == 'Windows'
        run: node scripts/verify-registry-install.mjs --if-published
        timeout-minutes: 25
