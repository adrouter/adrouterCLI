name: Stage tagged release

on:
  push:
    tags: ["v*"]

permissions: {}
concurrency:
  group: release-tag-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate-and-stage:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    environment: adrouter-staging
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Refuse staging and attestation outside the canonical repository
        env:
          ACTUAL_REPOSITORY: ${{ github.repository }}
        run: test "${ACTUAL_REPOSITORY}" = "adrouter/adrouterCLI"
      - name: Checkout tagged commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.19.0"
          registry-url: https://registry.npmjs.org
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s "$(command -v fdfind)" /usr/local/bin/fd
      - run: npm ci --ignore-scripts
      - run: node scripts/validate-release-tag.mjs "${GITHUB_REF_NAME}"
      - run: npm run build
      - run: npm run check
      - run: npm run check:release-readiness
      - run: node scripts/test.mjs
      - name: Build release metadata from tagged source
        run: |
          mkdir -p release-assets
          node scripts/publish.mjs --dry-run --out release-assets --manifest release-assets/npm-artifacts.json
          npx --no-install cyclonedx-npm --output-file release-assets/adrouterCLI.cdx.json --spec-version 1.6
          cp THIRD_PARTY_NOTICES.md release-assets/
          cp docs/bundled-sources.json release-assets/BUNDLED_SOURCES.json
          node scripts/release-notes.mjs extract --version "${GITHUB_REF_NAME#v}" --tag "${GITHUB_REF_NAME}" --out release-assets/RELEASE_NOTES.md
          (cd release-assets && sha256sum adrouter-cli-*.tgz npm-artifacts.json adrouterCLI.cdx.json BUNDLED_SOURCES.json THIRD_PARTY_NOTICES.md > SHA256SUMS)
      - name: Attest bundled npm tarball
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release-assets/adrouter-cli-*.tgz
      - name: Attest npm artifact manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release-assets/npm-artifacts.json
      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release-assets/adrouterCLI.cdx.json
          sbom-path: release-assets/adrouterCLI.cdx.json
      - name: Attest bundled-source inventory
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release-assets/BUNDLED_SOURCES.json
      - name: Attest third-party notices
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release-assets/THIRD_PARTY_NOTICES.md
      - name: Stage draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq .isDraft 2>/dev/null || printf missing)" = missing
          prerelease_args=()
          if [[ "${GITHUB_REF_NAME}" == *-beta.* ]]; then prerelease_args+=(--prerelease); fi
          gh release create "${GITHUB_REF_NAME}" --verify-tag --draft "${prerelease_args[@]}" \
            --title "${GITHUB_REF_NAME}" --notes-file release-assets/RELEASE_NOTES.md \
            release-assets/adrouterCLI.cdx.json \
            release-assets/adrouter-cli-*.tgz \
            release-assets/BUNDLED_SOURCES.json \
            release-assets/npm-artifacts.json \
            release-assets/THIRD_PARTY_NOTICES.md \
            release-assets/SHA256SUMS
      - name: Verify staged draft inventory, checksums, and attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-draft-release.mjs "${GITHUB_REF_NAME}"
