name: Promote staged release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Protected beta or stable tag to promote
        required: true
        type: string
      phase:
        description: Publish the recorded candidate, or finalize npm and GitHub after installed-runtime verification
        required: true
        type: choice
        options:
          - publish-candidate
          - finalize-release

permissions: {}
concurrency:
  group: promote-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Refuse release operations outside the canonical repository
        env:
          ACTUAL_REPOSITORY: ${{ github.repository }}
        run: test "${ACTUAL_REPOSITORY}" = "adrouter/adrouterCLI"
      - name: Checkout protected tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.19.0"
          registry-url: https://registry.npmjs.org
      - run: npm ci --ignore-scripts
      - run: node scripts/validate-release-tag.mjs "${{ inputs.tag }}"
      - run: npm run build
      - run: npm run check
      - run: npm run check:release-readiness
      - run: node scripts/test.mjs
      - name: Download the recorded npm artifact from the draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-assets
          gh release download "${{ inputs.tag }}" \
            --pattern "adrouter-cli-*.tgz" \
            --pattern "npm-artifacts.json" \
            --dir release-assets
          cp release-assets/npm-artifacts.json npm-artifacts.json
      - name: Download exact-candidate authentication acceptance
        if: ${{ inputs.phase == 'finalize-release' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release download "${{ inputs.tag }}"
          --pattern "authentication-acceptance.json"
          --dir release-assets
      - name: Validate exact-candidate authentication acceptance
        if: ${{ inputs.phase == 'finalize-release' }}
        run: >-
          node scripts/validate-authentication-acceptance.mjs
          --file release-assets/authentication-acceptance.json
          --tag "${{ inputs.tag }}"
          --commit "$(git rev-parse HEAD)"
          --manifest release-assets/npm-artifacts.json
      - name: Publish the exact recorded tarball under candidate
        if: ${{ inputs.phase == 'publish-candidate' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: >-
          node scripts/publish.mjs --publish
          --tarball release-assets/adrouter-cli-*.tgz
          --manifest release-assets/npm-artifacts.json
      - name: Verify the recorded package is resumable
        run: node scripts/verify-npm-release.mjs --state resumable
      - name: Attest the exact npm-published tarball
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: release-assets/adrouter-cli-*.tgz
      - name: Attest the exact npm artifact manifest
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: release-assets/npm-artifacts.json
      - name: Checkout protected verifier from the workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: release-verifier-source
          sparse-checkout: scripts/verify-draft-release.mjs
          persist-credentials: false
      - name: Verify draft inventory, checksums, and attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node release-verifier-source/scripts/verify-draft-release.mjs
          "${{ inputs.tag }}" --allow-published

  registry-install:
    name: registry-install-${{ matrix.platform }}
    if: ${{ inputs.phase == 'finalize-release' }}
    needs: verify-and-publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-24.04
          - platform: linux-arm64
            os: ubuntu-24.04-arm
          - platform: windows-x64
            os: windows-2025
          - platform: windows-arm64
            os: windows-11-arm
          - platform: darwin-x64
            os: macos-15-intel
          - platform: darwin-arm64
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Refuse registry verification outside the canonical repository
        env:
          ACTUAL_REPOSITORY: ${{ github.repository }}
        run: test "${ACTUAL_REPOSITORY}" = "adrouter/adrouterCLI"
        shell: bash
      - name: Checkout protected tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.19.0"
          registry-url: https://registry.npmjs.org
      - name: Checkout protected registry verifier from the workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: registry-verifier-source
          sparse-checkout: |
            packages/ai/test/fixtures/platform-auth-v1.json
            scripts/verify-installed-runtime.mjs
            scripts/verify-registry-install.mjs
          persist-credentials: false
      - name: Verify the exact candidate anonymously with platform-safe package checks
        run: node registry-verifier-source/scripts/verify-registry-install.mjs

  finalize-npm:
    if: ${{ inputs.phase == 'finalize-release' }}
    needs:
      - verify-and-publish
      - registry-install
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout protected tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.19.0"
          registry-url: https://registry.npmjs.org
      - name: Download the recorded npm artifact manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ inputs.tag }}" --pattern "npm-artifacts.json" --dir .
      - name: Checkout protected release finalizer from the workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: release-finalizer-source
          sparse-checkout: |
            scripts/promote-npm-tags.mjs
            scripts/verify-npm-release.mjs
          persist-credentials: false
      - name: Promote final dist-tags only after every installed-runtime gate passes
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node release-finalizer-source/scripts/promote-npm-tags.mjs

  publish-github:
    if: ${{ inputs.phase == 'finalize-release' }}
    needs:
      - finalize-npm
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write
    steps:
      - name: Refuse publication outside the canonical repository
        env:
          ACTUAL_REPOSITORY: ${{ github.repository }}
        run: test "${ACTUAL_REPOSITORY}" = "adrouter/adrouterCLI"
      - name: Publish GitHub release after npm promotion succeeds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease_args=(--prerelease=false)
          if [[ "${{ inputs.tag }}" == *-beta.* ]]; then prerelease_args=(--prerelease); fi
          gh release edit "${{ inputs.tag }}" --repo adrouter/adrouterCLI --draft=false "${prerelease_args[@]}"
